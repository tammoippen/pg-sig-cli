[package]
name = "sqlsig"
version = "0.1.0"
edition = "2021"
description = "Parse a SQL script with Windmill's own parser and print the argument signature Windmill would infer for it, as JSON"
authors = ["Tammo Ippen <tammo.ippen@posteo.de>"]
repository = "https://github.com/tammoippen/pg-sig-cli"
readme = "README.md"
keywords = ["sql", "windmill", "parser", "cli"]
categories = ["command-line-utilities"]

# sqlsig links windmill-parser-sql, which is AGPLv3 (see NOTICE), so the
# combined work is AGPLv3 as well.
license = "AGPL-3.0-only"

# Git dependencies cannot be published to crates.io.
publish = false

# Windmill's parser crates are not published on crates.io, so they are pulled
# straight from the upstream repository, pinned to a commit. Cargo resolves
# them out of windmill's own `backend/` workspace
# (paths `backend/parsers/windmill-parser{,-sql}`). They remain under
# Windmill's upstream license (AGPLv3 for the backend).
[dependencies]
windmill-parser = { git = "https://github.com/windmill-labs/windmill", rev = "8aa8b7ee6c23f859f169637c0bfd3f8d964509e9" }
windmill-parser-sql = { git = "https://github.com/windmill-labs/windmill", rev = "8aa8b7ee6c23f859f169637c0bfd3f8d964509e9" }

anyhow = "^1"
serde_json = { version = "^1.0.151", features = ["preserve_order", "raw_value"] }
